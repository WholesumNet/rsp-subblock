[workspace.package]
[package]
name = "rsp-client-eth-agg"
description = ""
edition = "2021"

# elf optimization
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
embed-bitcode = true

[dependencies]
# workspace
rsp-client-executor = { path = "../../crates/executor/client" }

# alloy
alloy-primitives = { git = "https://github.com/brevis-network/alloy-core.git", branch = "pico-v1-4-1", default-features = false, features = ["map-foldhash", "sha3-keccak"] }

# sp1 turbo
sp1-zkvm = "=6.2.3"

# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }

[patch.crates-io]
# alloy
alloy-evm = { git = "https://github.com/brevis-network/alloy-evm.git", branch = "pico-v0-23-0" }
alloy-primitives = { git = "https://github.com/brevis-network/alloy-core.git", branch = "pico-v1-4-1" }
# revm
op-revm = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-bytecode = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-context = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-context-interface = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-database = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-database-interface = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-handler = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-inspector = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-interpreter = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-precompile = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-primitives = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
revm-state = { git = "https://github.com/wholesumnet/revm.git", branch = "hyp6.1" }
# misc
foldhash = { git = "https://github.com/brevis-network/foldhash.git", branch = "pico-v0-2-0" }

# precompiles

# sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-4.0.0", package = "sha2" }
# sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-4.0.0" }
# bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-5.0.0", package = "substrate-bn" }
# k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-5.0.0" }
# p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-5.0.0" }

sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.0.0", package = "sha2" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.0.0-rc.2", package = "substrate-bn-succinct-rs" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0-rc.2" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0-rc.2" }
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.0.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0-rc.2" }
